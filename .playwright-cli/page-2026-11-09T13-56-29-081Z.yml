    - region [ref=f7e200]:
      - heading "Perguntas das famílias" [level=2] [ref=f7e202]
      - generic [ref=f7e204]:
        - heading "Com que idade meu filho pode começar?" [level=3] [ref=f7e205]
        - paragraph [ref=f7e206]: No berçário recebemos bebês a partir de 4 meses. Depois, a criança segue pelos níveis da Educação Infantil (Nível I a Nível IV), sempre com planejamento próprio para cada faixa etária.
      - generic [ref=f7e208]:
        - heading "Qual é o horário da escola?" [level=3] [ref=f7e209]
        - paragraph [ref=f7e210]: De segunda a sexta, das 6h30 às 19h. Você escolhe entre meio período, semi-integral ou integral, com horários flexíveis para a sua rotina.
      - generic [ref=f7e212]:
        - heading "Qual material didático vocês usam?" [level=3] [ref=f7e213]
        - paragraph [ref=f7e214]: A Educação Infantil usa o Sistema de Ensino Positivo, da Editora Positivo. Somos escola conveniada. O berçário tem planejamentos próprios para cada idade.
      - generic [ref=f7e216]:
        - heading "Como funciona a alimentação?" [level=3] [ref=f7e217]
        - paragraph [ref=f7e218]: As refeições são feitas em cozinha própria, com alimentos frescos. O cardápio é da nutricionista Aline Fregozzi e respeita a orientação do pediatra da criança. Restrições e alergias são combinadas com a família.
      - generic [ref=f7e220]:
        - heading "Como é a estrutura da escola?" [level=3] [ref=f7e221]
        - paragraph [ref=f7e222]: Salas próprias para Berçário I, Berçário II e cada nível da Educação Infantil, além de biblioteca, brinquedoteca, parquinho, quadra coberta e cozinha própria. Venha conhecer pessoalmente.
      - generic [ref=f7e224]:
        - heading "Como acompanho o dia do meu filho?" [level=3] [ref=f7e225]
        - paragraph [ref=f7e226]: "Pela agenda digital Kid Note, no celular: recados, rotina e comunicados da escola chegam direto para a família."
      - generic [ref=f7e228]:
        - heading "A escola é segura?" [level=3] [ref=f7e229]
        - paragraph [ref=f7e230]: Sim. A escola tem sistema de segurança com câmeras e alarme e uma vaga exclusiva de embarque e desembarque escolar na porta. Os bebês são supervisionados de perto pela coordenação.
      - generic [ref=f7e232]:
        - heading "Quais aulas extras estão incluídas?" [level=3] [ref=f7e233]
        - paragraph [ref=f7e234]: Ballet, educação física, taekwondo, musicalização, futebol, inglês e artes, todas dentro da escola. Pergunte no WhatsApp quais estão incluídas no período que você escolher.
      - generic [ref=f7e236]:
        - heading "Como faço a matrícula e quanto custa?" [level=3] [ref=f7e237]
        - paragraph [ref=f7e238]: As matrículas estão abertas. Os valores dependem do período e da turma, então o melhor caminho é chamar no WhatsApp (11) 94871-4027 ou agendar uma visita para conhecer a escola pessoalmente.
