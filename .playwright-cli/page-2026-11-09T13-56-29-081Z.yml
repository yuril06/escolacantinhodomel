            - generic [ref=f7e96]:
              - paragraph [ref=f7e97]: "Formação integral: capacidades motoras, afetivas, sociais e cognitivas. Partimos da realidade de cada aluno e, com estímulos e desafios, ele age sobre o mundo, entende o que fez e constrói o próprio conhecimento."
