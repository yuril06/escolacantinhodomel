            - heading "Alimentação" [level=3] [ref=f7e87]
            - generic [ref=f7e88]:
              - paragraph [ref=f7e89]: Tudo é preparado em cozinha própria, com alimentos fresquinhos e refeições equilibradas. A equipe recebe treinamento periódico de higiene, conservação e manipulação dos alimentos.
              - paragraph [ref=f7e90]:
