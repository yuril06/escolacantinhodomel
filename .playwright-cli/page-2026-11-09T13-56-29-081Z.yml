            - generic [ref=f7e80]:
              - paragraph [ref=f7e81]: Uma base sólida para o crescimento saudável. Exploramos atividades que desenvolvem a criança física, social e emocionalmente, e estimulamos a linguagem com histórias, dramatização e brincadeiras, respeitando o jeito de cada um.
              - paragraph [ref=f7e82]:
                - strong [ref=f7e83]: "Turmas:"
                - text: Nível I, Nível II, Nível III e Nível IV, com o Sistema de Ensino Positivo.
