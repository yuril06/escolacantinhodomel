            - generic [ref=f4e71]:
              - paragraph [ref=f4e72]: Uma base sólida para o crescimento saudável. Exploramos atividades que desenvolvem a criança física, social e emocionalmente, e estimulamos a linguagem com histórias, dramatização e brincadeiras, respeitando o jeito de cada um.
              - paragraph [ref=f4e73]:
