            - generic [ref=f11e63]:
              - paragraph [ref=f11e64]: Cuidado e educação num ambiente tranquilo, que transmite confiança, afeto e aprendizagens que fazem sentido para os bebês. Cada bebê é acompanhado individualmente por profissionais qualificados, com supervisão direta da coordenação.
