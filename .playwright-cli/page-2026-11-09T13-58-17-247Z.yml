    - region [ref=f11e191]:
      - heading "Perguntas das famílias" [level=2] [ref=f11e193]
      - generic [ref=f11e195]:
        - heading "Com que idade meu filho pode começar?" [level=3] [ref=f11e196]
        - paragraph [ref=f11e197]: No berçário recebemos bebês a partir de 4 meses. Depois, a criança segue pelos níveis da Educação Infantil (Nível I a Nível IV), sempre com planejamento próprio para cada faixa etária.
      - generic [ref=f11e199]:
        - heading "Qual é o horário da escola?" [level=3] [ref=f11e200]
        - paragraph [ref=f11e201]: De segunda a sexta, das 6h30 às 19h. Você escolhe entre meio período, semi-integral ou integral, com horários flexíveis para a sua rotina.
      - generic [ref=f11e203]:
        - heading "Qual material didático vocês usam?" [level=3] [ref=f11e204]
        - paragraph [ref=f11e205]: A Educação Infantil usa o Sistema de Ensino Positivo, da Editora Positivo. Somos escola conveniada. O berçário tem planejamentos próprios para cada idade.
      - generic [ref=f11e207]:
        - heading "Como funciona a alimentação?" [level=3] [ref=f11e208]
        - paragraph [ref=f11e209]: As refeições são feitas em cozinha própria, com alimentos frescos. O cardápio é da nutricionista Aline Fregozzi e respeita a orientação do pediatra da criança. Restrições e alergias são combinadas com a família.
      - generic [ref=f11e211]:
        - heading "Como é a estrutura da escola?" [level=3] [ref=f11e212]
        - paragraph [ref=f11e213]: Salas próprias para Berçário I, Berçário II e cada nível da Educação Infantil, além de biblioteca, brinquedoteca, parquinho, quadra coberta e cozinha própria. Venha conhecer pessoalmente.
      - generic [ref=f11e215]:
        - heading "Como acompanho o dia do meu filho?" [level=3] [ref=f11e216]
        - paragraph [ref=f11e217]: "Pela agenda digital Kid Note, no celular: recados, rotina e comunicados da escola chegam direto para a família."
      - generic [ref=f11e219]:
        - heading "A escola é segura?" [level=3] [ref=f11e220]
        - paragraph [ref=f11e221]: Sim. A escola tem sistema de segurança com câmeras e alarme e uma vaga exclusiva de embarque e desembarque escolar na porta. Os bebês são supervisionados de perto pela coordenação.
      - generic [ref=f11e223]:
        - heading "Quais aulas extras estão incluídas?" [level=3] [ref=f11e224]
        - paragraph [ref=f11e225]: Ballet, educação física, taekwondo, musicalização, futebol, inglês e artes, todas dentro da escola. Pergunte no WhatsApp quais estão incluídas no período que você escolher.
      - generic [ref=f11e227]:
        - heading "Como faço a matrícula e quanto custa?" [level=3] [ref=f11e228]
        - paragraph [ref=f11e229]: As matrículas estão abertas. Os valores dependem do período e da turma, então o melhor caminho é chamar no WhatsApp (11) 94871-4027 ou agendar uma visita para conhecer a escola pessoalmente.
